<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elastic Vertex Destruction with TSL</title>
    <meta name="author" content="Lolo Armdz for Codrops" />
    <link rel="icon" type="image/svg+xml" href="https://tympanus.net/favicon/favicon.svg" />
    <link rel="shortcut icon" href="https://tympanus.net/favicon/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overscroll-behavior: contain;
        touch-action: none;
      }

      html,
      body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      *,
      *::after,
      *::before {
        box-sizing: border-box;
      }

      :root {
        font-size: 12px;
        --color-text: #808080;
        --color-bg: #1a1e27;
        --color-link: #fff;
        --color-link-hover: #fff;
        --page-padding: 1.5rem;
      }

      body {
        margin: 0;
        color: var(--color-text);
        background-color: var(--color-bg);
        font-family: ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (scripting: enabled) {
        .loading {
          &::before,
          &::after {
            content: '';
            position: fixed;
            z-index: 10000;
          }

          &::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
          }

          &::after {
            top: 50%;
            left: 50%;
            width: 100px;
            height: 1px;
            margin: 0 0 0 -50px;
            background: var(--color-link);
            animation: loaderAnim 1.5s ease-in-out infinite alternate forwards;
          }
        }
      }

      @keyframes loaderAnim {
        0% {
          transform: scaleX(0);
          transform-origin: 0% 50%;
        }

        50% {
          transform: scaleX(1);
          transform-origin: 0% 50%;
        }

        50.1% {
          transform: scaleX(1);
          transform-origin: 100% 50%;
        }

        100% {
          transform: scaleX(0);
          transform-origin: 100% 50%;
        }
      }

      a {
        text-decoration: none;
        color: var(--color-link);
        outline: none;
        cursor: pointer;

        &:hover {
          text-decoration: underline;
          color: var(--color-link-hover);
        }

        &:focus {
          outline: none;
          background: lightgrey;

          &:not(:focus-visible) {
            background: transparent;
          }

          &:focus-visible {
            outline: 2px solid red;
            background: transparent;
          }
        }
      }

      .frame {
        padding: 3rem var(--page-padding) 0;
        display: grid;
        z-index: 1000;
        position: relative;
        grid-row-gap: 1rem;
        grid-column-gap: 2rem;
        pointer-events: none;
        justify-items: start;
        grid-template-columns: auto auto;
        grid-template-areas:
          'title'
          'back'
          'archive'
          'github'
          'tags'
          'sponsor';

        #cdawrap {
          justify-self: start;
          grid-area: sponsor;
        }

        a,
        button {
          pointer-events: auto;
        }

        .frame__title {
          grid-area: title;
          font-size: inherit;
          margin: 0;
        }

        .frame__back {
          grid-area: back;
          justify-self: start;
        }

        .frame__archive {
          grid-area: archive;
          justify-self: start;
        }

        .frame__github {
          grid-area: github;
        }

        .frame__tags {
          grid-area: tags;
          display: flex;
          flex-wrap: wrap;
          gap: 1rem;
        }

        @media screen and (min-width: 53em) {
          padding: var(--page-padding);
          height: 100%;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          grid-template-columns: auto auto auto auto 1fr;
          grid-template-rows: auto auto;
          align-content: space-between;
          grid-template-areas:
            'title back github archive ...'
            'tags tags tags sponsor sponsor';

          .frame__tags {
            align-self: end;
          }

          #cdawrap {
            justify-self: end;
            text-align: right;
            max-width: 300px;
          }
        }
      }
    </style>
  </head>
  <body class="loading">
    <canvas id="canvas"></canvas>
    <header class="frame">
      <h1 class="frame__title">
        Interactive Text Destruction by
        <a href="http://nuevosmiedos.xyz" target="_blank">Lolo Armdz</a>
      </h1>
      <a class="frame__back" href="https://tympanus.net/codrops/?p=96654">Tutorial</a>
      <a class="frame__archive" href="https://tympanus.net/codrops/demos/">All demos</a>
      <a class="frame__github" href="https://github.com/armdz/tsl_elastic_vertex_destruction">Code</a>
      <nav class="frame__tags">
        <a href="https://tympanus.net/codrops/demos/?tag=webgpu">#webgpu</a>
        <a href="https://tympanus.net/codrops/demos/?tag=three-js">#three.js</a>
        <a href="https://tympanus.net/codrops/demos/?tag=tsl">#tsl</a>
        <a href="https://tympanus.net/codrops/demos/?tag=typography">#typography</a>
      </nav>
    </header>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
